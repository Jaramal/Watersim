<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
		<title>Watersim</title>
		<link rel="manifest" href="manifest.json">
		<meta name="theme-color" content="#000000">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
		<style>
			html, body {
				height: 100%;
				margin: 0;
				overflow: hidden;
				overscroll-behavior: none;
				touch-action: none;
				background: #05060a;
			}
			#myCanvas {
				position: fixed;
				touch-action: none;
				outline: 1px solid rgba(255, 255, 255, 0.15);
				transition: top 0.25s ease;
				background: linear-gradient(#000000, #000080);
			}

			/* menu des options : masqué sous le bas de l'écran, on le fait monter en balayant vers le haut */
			.menu-sheet {
				position: fixed;
				left: 0;
				right: 0;
				bottom: 0;
				z-index: 20;
				max-height: 85vh;
				overflow-y: auto;
				touch-action: pan-y;
				padding-bottom: env(safe-area-inset-bottom);
				background: rgba(22, 24, 29, 0.94);
				color: #e9ecef;
				transform: translateY(100%);
				visibility: hidden;
				transition: transform 0.25s ease, visibility 0s linear 0.25s;
			}
			.menu-sheet.open {
				transform: none;
				visibility: visible;
				transition: transform 0.25s ease;
			}
			.menu-content {
				max-width: 520px;
				margin: 0 auto;
				padding: 0 16px 16px;
			}
			.menu-grip {
				display: flex;
				justify-content: center;
				padding: 10px 0 8px;
				touch-action: none;
			}
			.menu-handle {
				position: fixed;
				left: 0;
				right: 0;
				bottom: 0;
				z-index: 10;
				height: 30px;
				display: flex;
				justify-content: center;
				align-items: center;
				padding-bottom: env(safe-area-inset-bottom);
				cursor: pointer;
			}
			.menu-grip span, .menu-handle span {

				height: 5px;
				border-radius: 3px;
				background: rgba(255, 255, 255, 0.35);
			}
			.menu-status {
				font-size: 12px;
				opacity: 0.65;
			}
		</style>
	</head>
	
<body>

	<canvas id="myCanvas"></canvas>

	<div id="menuHandle" class="menu-handle" role="button" aria-label="Ouvrir les options"><span></span></div>

	<div id="menu" class="menu-sheet border-top rounded-top-4 shadow-lg" aria-hidden="true">
		<div class="menu-grip"><span></span></div>
		<div class="menu-content">

			<div class="d-flex align-items-center mb-3">
				<h6 class="mb-0 flex-grow-1">Options</h6>
				<button id="menuClose" type="button" class="btn-close" aria-label="Fermer"></button>
			</div>

			<div class="row g-2 mb-3">
				<div class="col-6">
					<div class="form-check form-switch">
						<input id="optEsp" class="form-check-input" type="checkbox" role="switch" onchange="toggleEspMode()">
						<label class="form-check-label" for="optEsp">ESP-Mosaico</label>
					</div>
				</div>
				<div class="col-6">
					<div class="form-check form-switch">
						<input id="optDrift" class="form-check-input" type="checkbox" role="switch" checked onchange="scene.compensateDrift = this.checked">
						<label class="form-check-label" for="optDrift">Compensate Drift</label>
					</div>
				</div>
				<div class="col-6">
					<div class="form-check form-switch">
						<input id="optBoat" class="form-check-input" type="checkbox" role="switch" checked onchange="setBodyVisible(boat, this.checked)">
						<label class="form-check-label" for="optBoat">Bateau</label>
					</div>
				</div>
				<div class="col-6">
					<div class="form-check form-switch">
						<input id="optIceberg" class="form-check-input" type="checkbox" role="switch" checked onchange="setBodyVisible(iceberg, this.checked)">
						<label class="form-check-label" for="optIceberg">Iceberg</label>
					</div>
				</div>
			</div>

			<label class="form-label d-flex justify-content-between mb-0" for="sizeSlider">

			<div class="menu-status mt-3">

				<div id="motionStatus"></div>
			</div>
		</div>
	</div>
	
<script>

	var canvas = document.getElementById("myCanvas");
	var gl = canvas.getContext("webgl");	

	// couleurs de l'eau : dégradé du bleu profond (eau dense et calme) au blanc (écume, embruns).
	// chaque particule porte un niveau d'écume entre 0 et 1 qui choisit sa couleur dans la table

	var waterStops = [
		0.00, 0, 0, 160,
		0.25, 8, 40, 195,
		0.50, 25, 105, 230,
		0.75, 105, 190, 250,
		1.00, 240, 250, 255
	];
	var numWaterColors = 64;
	var waterColors = new Float32Array(3 * numWaterColors);

	for (var i = 0; i < numWaterColors; i++) {
		var t = i / (numWaterColors - 1);
		var k = 0;
		while (k < waterStops.length / 4 - 2 && t > waterStops[4 * (k + 1)])
			k++;
		var u = (t - waterStops[4 * k]) / (waterStops[4 * (k + 1)] - waterStops[4 * k]);
		for (var j = 0; j < 3; j++)
			waterColors[3 * i + j] = (waterStops[4 * k + 1 + j] + u * (waterStops[4 * (k + 1) + 1 + j] - waterStops[4 * k + 1 + j])) / 255.0;
	}

	var foamRiseRate = 12.0;	// vitesse d'apparition de l'écume, par seconde
	var foamFadeRate = 1.5;		// vitesse de retour au bleu profond, par seconde
	var foamSpeed = 3.5;		// vitesse de l'eau à partir de laquelle elle s'éclaircit au maximum
	var foamSpeedWeight = 0.6;	// éclaircissement maximal dû à la seule vitesse
	canvas.width = 480;
	canvas.height = 480;

	// affichage : par défaut le canvas est agrandi à toute la largeur de l'écran ;
	// en mode ESP-Mosaico il occupe 480 x 480 pixels physiques, centré et calé sur la grille de pixels.
	// dans les deux cas la simulation est calculée en 480 x 480

	function placeCanvas()
	{
		var espMode = typeof scene != "undefined" && scene && scene.espMode;
		var dpr = window.devicePixelRatio || 1;

		// menu ouvert : la simulation remonte pour rester visible au-dessus, tant qu'il y a la place
		var menuElem = document.getElementById("menu");
		var height = window.innerHeight;
		if (menuElem && menuElem.classList.contains("open"))
			height -= menuElem.offsetHeight;

		var size, left, top;
		if (espMode) {
			size = canvas.width / dpr;
			left = Math.round((window.innerWidth * dpr - canvas.width) / 2) / dpr;
			top = Math.round(Math.max((height * dpr - canvas.height) / 2, 0)) / dpr;
		}
		else {
			size = Math.min(window.innerWidth, window.innerHeight) - 4;
			left = (window.innerWidth - size) / 2;
			top = Math.max((height - size) / 2, 2);
		}
		canvas.style.width = size + "px";
		canvas.style.height = size + "px";
		canvas.style.left = left + "px";
		canvas.style.top = top + "px";
		canvas.style.imageRendering = espMode ? "pixelated" : "auto";

		// largeur physique estimée de l'affichage : 160 pixels CSS par pouce sur un téléphone, 96 sinon
		var cssPerInch = navigator.maxTouchPoints > 0 ? 160 : 96;
		displaySize = size / cssPerInch * 0.0254;
		if (typeof scene != "undefined" && scene)
			updateTankSize();
	}

	var displaySize = 0.07;		// mètres
	placeCanvas();
	window.addEventListener('resize', placeCanvas);

	canvas.focus();

	var simHeight = 3.0;	
	var cScale = canvas.height / simHeight;
	var simWidth = canvas.width / cScale;

	var U_FIELD = 0;
	var V_FIELD = 1;
	
	var FLUID_CELL = 0;
	var AIR_CELL = 1;
	var SOLID_CELL = 2;

	var cnt = 0;

	function clamp(x, min, max) 
	{
		if (x < min)
			return min;
		else if (x > max)
			return max;
		else 
			return x;
	}

	// ----------------- start of simulator ------------------------------

	class FlipFluid {
		constructor(density, width, height, spacing, particleRadius, maxParticles) {

			// fluid

			this.density = density;
			this.fNumX = Math.floor(width / spacing) + 1;
			this.fNumY = Math.floor(height / spacing) + 1;
			this.h = Math.max(width / this.fNumX, height / this.fNumY);
			this.fInvSpacing = 1.0 / this.h;
			this.fNumCells = this.fNumX * this.fNumY;

			this.u = new Float32Array(this.fNumCells);
			this.v = new Float32Array(this.fNumCells);
			this.du = new Float32Array(this.fNumCells);
			this.dv = new Float32Array(this.fNumCells);
			this.prevU = new Float32Array(this.fNumCells);
			this.prevV = new Float32Array(this.fNumCells);
			this.p = new Float32Array(this.fNumCells);
			this.s = new Float32Array(this.fNumCells);
			this.cellType = new Int32Array(this.fNumCells);

			// particles

			this.maxParticles = maxParticles;

			this.particlePos = new Float32Array(2 * this.maxParticles);
			this.particleColor = new Float32Array(3 * this.maxParticles);
			for (var i = 0; i < this.maxParticles; i++) {
				this.particleColor[3 * i] = waterColors[0];
				this.particleColor[3 * i + 1] = waterColors[1];
				this.particleColor[3 * i + 2] = waterColors[2];
			}
			this.particleFoam = new Float32Array(this.maxParticles);

			this.particleVel = new Float32Array(2 * this.maxParticles);
			this.particleDensity = new Float32Array(this.fNumCells);
			this.particleRestDensity = 0.0;

			this.particleRadius = particleRadius;
			this.pInvSpacing = 1.0 / (2.2 * particleRadius);
			this.pNumX = Math.floor(width * this.pInvSpacing) + 1;
			this.pNumY = Math.floor(height * this.pInvSpacing) + 1;
			this.pNumCells = this.pNumX * this.pNumY;

			this.numCellParticles = new Int32Array(this.pNumCells);
			this.firstCellParticle = new Int32Array(this.pNumCells + 1);
			this.cellParticleIds = new Int32Array(maxParticles);

			this.numParticles = 0;
		}

		integrateParticles(dt, gravityX, gravity) 
		{
			for (var i = 0; i < this.numParticles; i++) {
				this.particleVel[2 * i] += dt * gravityX;
				this.particleVel[2 * i + 1] += dt * gravity;
				this.particlePos[2 * i] += this.particleVel[2 * i] * dt;
				this.particlePos[2 * i + 1] += this.particleVel[2 * i + 1] * dt;
			}
		}

		pushParticlesApart(numIters) 
		{

			// count particles per cell

			this.numCellParticles.fill(0);

			for (var i = 0; i < this.numParticles; i++) {
				var x = this.particlePos[2 * i];
				var y = this.particlePos[2 * i + 1];

				var xi = clamp(Math.floor(x * this.pInvSpacing), 0, this.pNumX - 1);
				var yi = clamp(Math.floor(y * this.pInvSpacing), 0, this.pNumY - 1);
				var cellNr = xi * this.pNumY + yi;
				this.numCellParticles[cellNr]++;
			}

			// partial sums

			var first = 0;

			for (var i = 0; i < this.pNumCells; i++) {
				first += this.numCellParticles[i];
				this.firstCellParticle[i] = first;
			}
			this.firstCellParticle[this.pNumCells] = first;		// guard

			// fill particles into cells

			for (var i = 0; i < this.numParticles; i++) {
				var x = this.particlePos[2 * i];
				var y = this.particlePos[2 * i + 1];

				var xi = clamp(Math.floor(x * this.pInvSpacing), 0, this.pNumX - 1);
				var yi = clamp(Math.floor(y * this.pInvSpacing), 0, this.pNumY - 1);
				var cellNr = xi * this.pNumY + yi;
				this.firstCellParticle[cellNr]--;
				this.cellParticleIds[this.firstCellParticle[cellNr]] = i;
			}

			// push particles apart

			var minDist = 2.0 * this.particleRadius;
			var minDist2 = minDist * minDist;

			for (var iter = 0; iter < numIters; iter++) {

				for (var i = 0; i < this.numParticles; i++) {
					var px = this.particlePos[2 * i];
					var py = this.particlePos[2 * i + 1];

					var pxi = Math.floor(px * this.pInvSpacing);
					var pyi = Math.floor(py * this.pInvSpacing);
					var x0 = Math.max(pxi - 1, 0);
					var y0 = Math.max(pyi - 1, 0);
					var x1 = Math.min(pxi + 1, this.pNumX - 1);
					var y1 = Math.min(pyi + 1, this.pNumY - 1);

					for (var xi = x0; xi <= x1; xi++) {
						for (var yi = y0; yi <= y1; yi++) {
							var cellNr = xi * this.pNumY + yi;
							var first = this.firstCellParticle[cellNr];
							var last = this.firstCellParticle[cellNr + 1];
							for (var j = first; j < last; j++) {
								var id = this.cellParticleIds[j];
								if (id == i)
									continue;
								var qx = this.particlePos[2 * id];
								var qy = this.particlePos[2 * id + 1];

								var dx = qx - px;
								var dy = qy - py;
								var d2 = dx * dx + dy * dy;
								if (d2 > minDist2 || d2 == 0.0) 
									continue;
								var d = Math.sqrt(d2);
								var s = 0.5 * (minDist - d) / d;
								dx *= s;
								dy *= s;
								this.particlePos[2 * i] -= dx;
								this.particlePos[2 * i + 1] -= dy;
								this.particlePos[2 * id] += dx;
								this.particlePos[2 * id + 1] += dy;
							}
						}
					}
				}
			}
		}

		handleParticleCollisions(obstacleX, obstacleY, obstacleRadius) 
		{
			var h = 1.0 / this.fInvSpacing;
			var r = this.particleRadius;
			var or = obstacleRadius;
			var or2 = or * or;
			var minDist = obstacleRadius + r;
			var minDist2 = minDist * minDist;

			var minX = h + r;
			var maxX = (this.fNumX - 1) * h - r;
			var minY = h + r;
			var maxY = (this.fNumY - 1) * h - r;


			for (var i = 0; i < this.numParticles; i++) {
				var x = this.particlePos[2 * i];
				var y = this.particlePos[2 * i + 1];

				var dx = x - obstacleX;
				var dy = y - obstacleY;
				var d2 = dx * dx + dy * dy;

				// obstacle collision

				if (scene.showObstacle && d2 < minDist2) {

					// var d = Math.sqrt(d2);
					// var s = (minDist - d) / d;
					// x += dx * s;
					// y += dy * s;

					this.particleVel[2 * i] = scene.obstacleVelX;
					this.particleVel[2 * i + 1] = scene.obstacleVelY;
				}

				// wall collisions

				if (x < minX) {
					x = minX;
					this.particleVel[2 * i] = 0.0;

				}
				if (x > maxX) {
					x = maxX;
					this.particleVel[2 * i] = 0.0;
				}
				if (y < minY) {
					y = minY;
					this.particleVel[2 * i + 1] = 0.0;
				}
				if (y > maxY) {
					y = maxY;
					this.particleVel[2 * i + 1] = 0.0;
				}
				this.particlePos[2 * i] = x;
				this.particlePos[2 * i + 1] = y;
			}
		}

		updateParticleDensity()
		{
			var n = this.fNumY;
			var h = this.h;
			var h1 = this.fInvSpacing;
			var h2 = 0.5 * h;

			var d = f.particleDensity;

			d.fill(0.0);

			for (var i = 0; i < this.numParticles; i++) {
				var x = this.particlePos[2 * i];
				var y = this.particlePos[2 * i + 1];

				x = clamp(x, h, (this.fNumX - 1) * h);
				y = clamp(y, h, (this.fNumY - 1) * h);

				var x0 = Math.floor((x - h2) * h1);
				var tx = ((x - h2) - x0 * h) * h1;
				var x1 = Math.min(x0 + 1, this.fNumX-2);
				
				var y0 = Math.floor((y-h2)*h1);
				var ty = ((y - h2) - y0*h) * h1;
				var y1 = Math.min(y0 + 1, this.fNumY-2);

				var sx = 1.0 - tx;
				var sy = 1.0 - ty;

				if (x0 < this.fNumX && y0 < this.fNumY) d[x0 * n + y0] += sx * sy;
				if (x1 < this.fNumX && y0 < this.fNumY) d[x1 * n + y0] += tx * sy;
				if (x1 < this.fNumX && y1 < this.fNumY) d[x1 * n + y1] += tx * ty;
				if (x0 < this.fNumX && y1 < this.fNumY) d[x0 * n + y1] += sx * ty;
			}

			if (this.particleRestDensity == 0.0) {
				var sum = 0.0;
				var numFluidCells = 0;

				for (var i = 0; i < this.fNumCells; i++) {
					if (this.cellType[i] == FLUID_CELL) {
						sum += d[i];
						numFluidCells++;
					}
				}

				if (numFluidCells > 0)
					this.particleRestDensity = sum / numFluidCells;
			}

// 					var cellNr = xi * n + yi;
// 					if (this.cellType[cellNr] != FLUID_CELL)
// 						continue;
// 					var hx = this.h;
// 					var hy = this.h;

// 					if (this.cellType[(xi - 1) * n + yi] == SOLID_CELL || this.cellType[(xi + 1) * n + yi] == SOLID_CELL)
// 						hx -= this.particleRadius;
// 					if (this.cellType[xi * n + yi - 1] == SOLID_CELL || this.cellType[xi * n + yi + 1] == SOLID_CELL)
// 						hy -= this.particleRadius;

// 					var scale = this.h * this.h / (hx * hy)
// 					d[cellNr] *= scale;
// 				}
// 			}
		}

		transferVelocities(toGrid, flipRatio)
		{
			var n = this.fNumY;
			var h = this.h;
			var h1 = this.fInvSpacing;
			var h2 = 0.5 * h;

			if (toGrid) {

				this.prevU.set(this.u);
				this.prevV.set(this.v);

				this.du.fill(0.0);
				this.dv.fill(0.0);
				this.u.fill(0.0);
				this.v.fill(0.0);

				for (var i = 0; i < this.fNumCells; i++) 
					this.cellType[i] = this.s[i] == 0.0 ? SOLID_CELL : AIR_CELL;

				for (var i = 0; i < this.numParticles; i++) {
					var x = this.particlePos[2 * i];
					var y = this.particlePos[2 * i + 1];
					var xi = clamp(Math.floor(x * h1), 0, this.fNumX - 1);
					var yi = clamp(Math.floor(y * h1), 0, this.fNumY - 1);
					var cellNr = xi * n + yi;
					if (this.cellType[cellNr] == AIR_CELL)
						this.cellType[cellNr] = FLUID_CELL;
				}
			}

			for (var component = 0; component < 2; component++) {

				var dx = component == 0 ? 0.0 : h2;
				var dy = component == 0 ? h2 : 0.0;
	
				var f = component == 0 ? this.u : this.v;
				var prevF = component == 0 ? this.prevU : this.prevV;
				var d = component == 0 ? this.du : this.dv;

				for (var i = 0; i < this.numParticles; i++) {
					var x = this.particlePos[2 * i];
					var y = this.particlePos[2 * i + 1];

					x = clamp(x, h, (this.fNumX - 1) * h);
					y = clamp(y, h, (this.fNumY - 1) * h);

					var x0 = Math.min(Math.floor((x - dx) * h1), this.fNumX - 2);
					var tx = ((x - dx) - x0 * h) * h1;
					var x1 = Math.min(x0 + 1, this.fNumX-2);
					
					var y0 = Math.min(Math.floor((y-dy)*h1), this.fNumY-2);
					var ty = ((y - dy) - y0*h) * h1;
					var y1 = Math.min(y0 + 1, this.fNumY-2);

					var sx = 1.0 - tx;
					var sy = 1.0 - ty;

					var d0 = sx*sy;
					var d1 = tx*sy;
					var d2 = tx*ty;
					var d3 = sx*ty;

					var nr0 = x0*n + y0;
					var nr1 = x1*n + y0;
					var nr2 = x1*n + y1;
					var nr3 = x0*n + y1;

					if (toGrid) {
						var pv = this.particleVel[2 * i + component];
						f[nr0] += pv * d0;  d[nr0] += d0;
						f[nr1] += pv * d1;  d[nr1] += d1;
						f[nr2] += pv * d2;  d[nr2] += d2;
						f[nr3] += pv * d3;  d[nr3] += d3;
					}
					else {
						var offset = component == 0 ? n : 1;
						var valid0 = this.cellType[nr0] != AIR_CELL || this.cellType[nr0 - offset] != AIR_CELL ? 1.0 : 0.0;
						var valid1 = this.cellType[nr1] != AIR_CELL || this.cellType[nr1 - offset] != AIR_CELL ? 1.0 : 0.0;
						var valid2 = this.cellType[nr2] != AIR_CELL || this.cellType[nr2 - offset] != AIR_CELL ? 1.0 : 0.0;
						var valid3 = this.cellType[nr3] != AIR_CELL || this.cellType[nr3 - offset] != AIR_CELL ? 1.0 : 0.0;

						var v = this.particleVel[2 * i + component];
						var d = valid0 * d0 + valid1 * d1 + valid2 * d2 + valid3 * d3;

						if (d > 0.0) {

							var picV = (valid0 * d0 * f[nr0] + valid1 * d1 * f[nr1] + valid2 * d2 * f[nr2] + valid3 * d3 * f[nr3]) / d;
							var corr = (valid0 * d0 * (f[nr0] - prevF[nr0]) + valid1 * d1 * (f[nr1] - prevF[nr1])
								+ valid2 * d2 * (f[nr2] - prevF[nr2]) + valid3 * d3 * (f[nr3] - prevF[nr3])) / d;
							var flipV = v + corr;

							this.particleVel[2 * i + component] = (1.0 - flipRatio) * picV + flipRatio * flipV;
						}
					}
				}

				if (toGrid) {
					for (var i = 0; i < f.length; i++) {
						if (d[i] > 0.0)
							f[i] /= d[i];
					}

					// restore solid cells

					for (var i = 0; i < this.fNumX; i++) {
						for (var j = 0; j < this.fNumY; j++) {
							var solid = this.cellType[i * n + j] == SOLID_CELL;
							if (solid || (i > 0 && this.cellType[(i - 1) * n + j] == SOLID_CELL))
								this.u[i * n + j] = this.prevU[i * n + j];
							if (solid || (j > 0 && this.cellType[i * n + j - 1] == SOLID_CELL))
								this.v[i * n + j] = this.prevV[i * n + j];
						}
					}
				}
			}
		}

		solveIncompressibility(numIters, dt, overRelaxation, compensateDrift = true) {

			this.p.fill(0.0);
			this.prevU.set(this.u);
			this.prevV.set(this.v);

			var n = this.fNumY;
			var cp = this.density * this.h / dt;

			for (var i = 0; i < this.fNumCells; i++) {
				var u = this.u[i];
				var v = this.v[i];
			}

			for (var iter = 0; iter < numIters; iter++) {

				for (var i = 1; i < this.fNumX-1; i++) {
					for (var j = 1; j < this.fNumY-1; j++) {

						if (this.cellType[i*n + j] != FLUID_CELL)
							continue;

						var center = i * n + j;
						var left = (i - 1) * n + j;
						var right = (i + 1) * n + j;
						var bottom = i * n + j - 1;
						var top = i * n + j + 1;

						var s = this.s[center];
						var sx0 = this.s[left];
						var sx1 = this.s[right];
						var sy0 = this.s[bottom];
						var sy1 = this.s[top];
						var s = sx0 + sx1 + sy0 + sy1;
						if (s == 0.0)
							continue;

						var div = this.u[right] - this.u[center] + 
							this.v[top] - this.v[center];

						if (this.particleRestDensity > 0.0 && compensateDrift) {
							var k = 1.0;
							var compression = this.particleDensity[i*n + j] - this.particleRestDensity;
							if (compression > 0.0)
								div = div - k * compression;
						}

						var p = -div / s;
						p *= overRelaxation;
						this.p[center] += cp * p;

						this.u[center] -= sx0 * p;
						this.u[right] += sx1 * p;
						this.v[center] -= sy0 * p;
						this.v[top] += sy1 * p;
					}
				}
			}
		}

		updateParticleColors(dt) 
		{
			var d0 = this.particleRestDensity;
			if (d0 <= 0.0)
				return;

			var h2 = 0.5 * this.h;
			var timeScale = Math.sqrt(scene.accScale);
			var rise = 1.0 - Math.exp(-foamRiseRate * timeScale * dt);
			var fade = 1.0 - Math.exp(-foamFadeRate * timeScale * dt);
			var speedScale = 1.0 / (foamSpeed * timeScale);

			for (var i = 0; i < this.numParticles; i++) {

				// écume visée : d'autant plus forte que l'eau est peu dense autour de la particule, ou rapide
				var relDensity = sampleGrid(this, this.particleDensity, this.particlePos[2 * i], this.particlePos[2 * i + 1], h2, h2) / d0;
				var target = clamp((0.95 - relDensity) / 0.6, 0.0, 1.0);

				var vx = this.particleVel[2 * i];
				var vy = this.particleVel[2 * i + 1];
				var speed = Math.sqrt(vx * vx + vy * vy) * speedScale;
				target = Math.max(target, foamSpeedWeight * Math.min(speed, 1.0));

				// l'écume apparaît vite et s'estompe lentement
				var foam = this.particleFoam[i];
				foam += (target - foam) * (target > foam ? rise : fade);
				this.particleFoam[i] = foam;

				var k = 3 * Math.floor(foam * (numWaterColors - 1) + 0.5);
				this.particleColor[3 * i] = waterColors[k];
				this.particleColor[3 * i + 1] = waterColors[k + 1];
				this.particleColor[3 * i + 2] = waterColors[k + 2];
			}
		}

		simulate(dt, gravity, flipRatio, numPressureIters, numParticleIters, overRelaxation, compensateDrift, obstacleX, abstacleY, obstacleRadius) 
		{
			var numSubSteps = scene.numSubSteps;
			var sdt = dt / numSubSteps;

			for (var step = 0; step < numSubSteps; step++) {
				this.integrateParticles(sdt, scene.gravityX * scene.accScale, gravity);
				this.pushParticlesApart(numParticleIters); 
				this.handleParticleCollisions(obstacleX, abstacleY, obstacleRadius)
				this.transferVelocities(true);
				this.updateParticleDensity();
				this.solveIncompressibility(numPressureIters, sdt, overRelaxation, compensateDrift);
				this.transferVelocities(false, flipRatio);
			}

			this.updateParticleColors(dt);
		}
	}

	// ----------------- end of simulator ------------------------------

	function setupScene() 
	{
		scene.obstacleRadius = 0.15;
		scene.overRelaxation = 1.9;

		scene.dt = 1.0 / 60.0;
		scene.numPressureIters = 50;
		scene.minPressureIters = 8;
		scene.numParticleIters = 2;
		scene.targetFps = 0;

		var res = 100;

		if (scene.espMode) {
			// budget ESP-Mosaico : grille 2 fois plus grossière, environ 5 fois moins de particules,
			// moins d'itérations de pression, et 30 images par seconde (pas de temps doublé,
			// ce que la grille plus grossière permet sans perte de stabilité)
			res = espRes;
			scene.numPressureIters = espPressureIters;
			scene.minPressureIters = espMinPressureIters;
			scene.targetFps = espFps;
			scene.dt = 1.0 / espFps;
		}
		
		var tankHeight = 1.0 * simHeight;
		var tankWidth = 1.0 * simWidth;
		var h = tankHeight / res;
		var density = 1000.0;

		var relWaterHeight = 0.8
		var relWaterWidth = 0.6

		// dam break

		// compute number of particles

		var r = 0.3 * h;	// particle radius w.r.t. cell size
		var dx = 2.0 * r;
		var dy = Math.sqrt(3.0) / 2.0 * dx;

 		var numX = Math.floor((relWaterWidth * tankWidth - 2.0 * h - 2.0 * r) / dx);
		var numY = Math.floor((relWaterHeight * tankHeight - 2.0 * h - 2.0 * r) / dy);
		var maxParticles = numX * numY;		

		// create fluid

		f = scene.fluid = new FlipFluid(density, tankWidth, tankHeight, h, r, maxParticles);

		// create particles

		f.numParticles = numX * numY;
		var p = 0;
		for (var i = 0; i < numX; i++) {
			for (var j = 0; j < numY; j++) {
				f.particlePos[p++] = h + r + dx * i + (j % 2 == 0 ? 0.0 : r);
				f.particlePos[p++] = h + r + dy * j
			}
		}

		// setup grid cells for tank

		var n = f.fNumY;

		for (var i = 0; i < f.fNumX; i++) {
			for (var j = 0; j < f.fNumY; j++) {
				var s = 1.0;	// fluid
				if (i == 0 || i == f.fNumX-1 || j == 0)
					s = 0.0;	// solid
				f.s[i*n + j] = s
			}
		}

		setObstacle(3.0, 2.0, true);

		// bateau et iceberg posés dans la colonne d'eau de départ, l'iceberg avec sa crête hors de l'eau
		if (boat == null) {
			boat = createBoat();
			iceberg = createIceberg();
			bodies = [boat, iceberg];
		}
		var px = 1.0 / cScale;
		var waterTop = relWaterHeight * tankHeight;
		placeBody(boat, 0.45, waterTop + 5.0 * px);
		placeBody(iceberg, 1.25, waterTop + (icebergTip - 0.5 * icebergSize) * px);
	}

	// construit un corps rigide à partir d'une image : pixels RVBA (première ligne en haut, alpha nul = vide),
	// densité et prise de l'eau de chaque pixel

	function createBody(width, height, pixels, densities, drags, blockX, blockY, righting)
	{
		var px = 1.0 / cScale;		// taille d'un pixel dans la simulation
		var b = {
			width : width, height : height, pixels : pixels, texture : null,
			righting : righting, visible : true,
			x : 0.0, y : 0.0, angle : 0.0,		// centre de gravité et orientation
			vx : 0.0, vy : 0.0, omega : 0.0
		};

		// points d'échantillonnage : un par bloc, pour la flottaison

		var xs = [], ys = [], areas = [], masses = [], pdrags = [];

		for (var r0 = 0; r0 < height; r0 += blockY) {
			for (var c0 = 0; c0 < width; c0 += blockX) {
				var area = 0.0, mass = 0.0, drag = 0.0, sx = 0.0, sy = 0.0;
				for (var r = r0; r < Math.min(r0 + blockY, height); r++) {
					for (var c = c0; c < Math.min(c0 + blockX, width); c++) {
						var p = r * width + c;
						if (pixels[4 * p + 3] == 0)
							continue;
						area += 1.0;
						mass += densities[p];
						drag += drags[p];
						sx += (c + 0.5 - 0.5 * width) * px;
						sy += (0.5 * height - r - 0.5) * px;
					}
				}
				if (area > 0.0) {
					xs.push(sx / area); ys.push(sy / area); areas.push(area); masses.push(mass); pdrags.push(drag);
				}
			}
		}

		// centre de gravité, puis passage dans le repère du corps

		var n = xs.length;
		var mass = 0.0, cx = 0.0, cy = 0.0;
		for (var i = 0; i < n; i++) {
			mass += masses[i]; cx += masses[i] * xs[i]; cy += masses[i] * ys[i];
		}
		cx /= mass; cy /= mass;

		b.numPoints = n;
		b.pointX = new Float32Array(n);
		b.pointY = new Float32Array(n);
		b.pointArea = new Float32Array(n);		// surface (volume déplacé) de chaque point, en pixels
		b.pointDrag = new Float32Array(n);		// prise de l'eau sur chaque point
		b.mass = mass;
		b.inertia = 0.0;
		b.area = 0.0;
		b.drag = 0.0;
		for (var i = 0; i < n; i++) {
			b.pointX[i] = xs[i] - cx;
			b.pointY[i] = ys[i] - cy;
			b.pointArea[i] = areas[i];
			b.area += areas[i];
			b.pointDrag[i] = pdrags[i];
			b.drag += pdrags[i];
			b.inertia += masses[i] * (b.pointX[i] * b.pointX[i] + b.pointY[i] * b.pointY[i]);
		}
		b.centerX = -cx;		// centre de l'image dans le repère du corps
		b.centerY = -cy;

		// profondeur de chaque pixel dans la forme (distance au bord, en pixels), pour les collisions

		var depth = new Float32Array(width * height);
		var diag = Math.SQRT2;
		for (var p = 0; p < width * height; p++)
			depth[p] = pixels[4 * p + 3] == 0 ? 0.0 : 1.0e6;

		function at(c, r) { return c < 0 || c >= width || r < 0 || r >= height ? 0.0 : depth[r * width + c]; }

		for (var r = 0; r < height; r++) {
			for (var c = 0; c < width; c++) {
				var p = r * width + c;
				if (depth[p] > 0.0)
					depth[p] = Math.min(depth[p], at(c - 1, r) + 1.0, at(c, r - 1) + 1.0, at(c - 1, r - 1) + diag, at(c + 1, r - 1) + diag);
			}
		}
		for (var r = height - 1; r >= 0; r--) {
			for (var c = width - 1; c >= 0; c--) {
				var p = r * width + c;
				if (depth[p] > 0.0)
					depth[p] = Math.min(depth[p], at(c + 1, r) + 1.0, at(c, r + 1) + 1.0, at(c + 1, r + 1) + diag, at(c - 1, r + 1) + diag);
			}
		}
		b.depth = depth;

		// points de contour : un pixel du bord sur deux, pour les parois et les collisions

		xs = []; ys = [];
		b.radius = 0.0;
		for (var r = 0; r < height; r++) {
			for (var c = 0; c < width; c++) {
				if (depth[r * width + c] != 1.0 || (c + r) % 2 != 0)
					continue;
				var x = (c + 0.5 - 0.5 * width) * px - cx;
				var y = (0.5 * height - r - 0.5) * px - cy;
				xs.push(x); ys.push(y);
				b.radius = Math.max(b.radius, Math.sqrt(x * x + y * y));
			}
		}
		b.numContour = xs.length;
		b.contourX = new Float32Array(xs);
		b.contourY = new Float32Array(ys);

		return b;
	}

	// pose un corps immobile et droit, centre de l'image en (x, y)

	function placeBody(b, x, y)
	{
		b.x = x - b.centerX; b.y = y - b.centerY; b.angle = 0.0;
		b.vx = 0.0; b.vy = 0.0; b.omega = 0.0;
	}

	function createBoat()
	{
		var n = boatWidth * boatHeight;
		var pixels = new Uint8Array(4 * n);
		var densities = new Float32Array(n);
		var drags = new Float32Array(n);

		for (var r = 0; r < boatHeight; r++) {
			for (var c = 0; c < boatWidth; c++) {
				var ch = boatSprite[r].charAt(c);
				if (ch == '.')
					continue;
				var p = r * boatWidth + c;
				var color = boatColors[ch];
				pixels[4 * p] = color[0]; pixels[4 * p + 1] = color[1]; pixels[4 * p + 2] = color[2]; pixels[4 * p + 3] = 255;
				densities[p] = boatDensities[ch];
				drags[p] = boatDragFactors[ch];
			}
		}
		return createBody(boatWidth, boatHeight, pixels, densities, drags, boatBlockX, boatBlockY, boatRighting);
	}

	// iceberg de forme aléatoire : une petite crête en dents de scie au-dessus de la ligne de flottaison,
	// un grand corps en dessous qui se resserre en marches jusqu'à une pointe, découpé en facettes de couleur

	function createIceberg()
	{
		var n = icebergSize;
		var tip = icebergTip;

		function rand(a, b) { return a + (b - a) * Math.random(); }

		// interpolation linéaire dans une liste de points [t, valeur] triée par t
		function interp(points, t) {
			if (t <= points[0][0])
				return points[0][1];
			for (var i = 1; i < points.length; i++) {
				if (t <= points[i][0]) {
					var p = points[i - 1], q = points[i];
					return q[0] <= p[0] ? q[1] : p[1] + (q[1] - p[1]) * (t - p[0]) / (q[0] - p[0]);
				}
			}
			return points[points.length - 1][1];
		}

		// flanc immergé : s'élargit jusqu'au bord de l'image juste sous la surface, puis descend en marches vers la pointe
		var tipX = rand(0.38, 0.62) * n;

		function flank(edge, waterX) {
			var y = tip + rand(5.0, 14.0);
			var x = edge;
			var points = [[tip, waterX], [y, x]];
			var steps = 3 + Math.floor(rand(0.0, 3.0));
			for (var k = 1; k <= steps; k++) {
				var t = k / (steps + 1);
				var target = edge + (tipX - edge) * Math.pow(t, rand(0.8, 1.5));
				var yk = Math.min(Math.max(tip + 14.0 + (n - 15.0 - tip) * (t + rand(-0.05, 0.05)), y + 4.0), n - 5.0);
				points.push([yk, x + (target - x) * rand(0.0, 0.3)]);		// pan presque vertical
				y = Math.min(yk + rand(2.0, 7.0), n - 3.0);
				x = target;
				points.push([y, x]);										// marche vers l'intérieur
			}
			points.push([n - 1.0, tipX]);
			return points;
		}

		var left = flank(0.0, rand(0.12, 0.24) * n);
		var right = flank(n, rand(0.76, 0.88) * n);

		// crête émergée : quelques pics, dont un atteint le haut de l'image
		var x0 = left[0][1];
		var x1 = right[0][1];
		var peaks = 3 + Math.floor(rand(0.0, 3.0));
		var highest = Math.floor(rand(0.0, peaks));
		var ridge = [[x0, 0.0]];
		for (var k = 0; k < peaks; k++) {
			ridge.push([x0 + (x1 - x0) * (k + rand(0.3, 0.7)) / peaks, k == highest ? tip : rand(0.4, 0.95) * tip]);
			if (k < peaks - 1)
				ridge.push([x0 + (x1 - x0) * (k + 1.0 + rand(-0.12, 0.12)) / peaks, rand(0.1, 0.4) * tip]);
		}
		ridge.push([x1, 0.0]);

		// facettes : chaque pixel prend la couleur du germe le plus proche (distance étirée verticalement)
		var seeds = [];
		for (var k = 0; k < 10; k++)
			seeds.push([rand(0.1, 0.9) * n, rand(0.0, 1.0) * n]);

		var pixels = new Uint8Array(4 * n * n);
		var densities = new Float32Array(n * n);
		var drags = new Float32Array(n * n);
		var weight = 0.0;
		var submerged = 0;

		for (var r = 0; r < n; r++) {
			for (var c = 0; c < n; c++) {
				var x = c + 0.5;
				var y = r + 0.5;
				var inside = r < tip ?
					x >= x0 && x <= x1 && tip - y <= interp(ridge, x) :
					x >= interp(left, y) - 0.5 && x <= interp(right, y) + 0.5;
				if (!inside)
					continue;

				var best = 0, bestDist = 1.0e9;
				for (var k = 0; k < seeds.length; k++) {
					var dx = x - seeds[k][0];
					var dy = 0.5 * (y - seeds[k][1]);
					if (dx * dx + dy * dy < bestDist) {
						bestDist = dx * dx + dy * dy; best = k;
					}
				}
				var colors = r < tip ? icebergColorsAbove : icebergColorsBelow;
				var color = colors[best % colors.length];

				var p = r * n + c;
				pixels[4 * p] = color[0]; pixels[4 * p + 1] = color[1]; pixels[4 * p + 2] = color[2]; pixels[4 * p + 3] = 255;
				densities[p] = icebergBallastTop + (icebergBallastBottom - icebergBallastTop) * r / (n - 1);
				drags[p] = 1.0;
				weight += densities[p];
				if (r >= tip)
					submerged++;
			}
		}

		// la masse totale vaut la surface à immerger : l'iceberg flotte avec sa crête hors de l'eau
		var scale = icebergFloat * submerged / weight;
		for (var p = 0; p < n * n; p++)
			densities[p] *= scale;

		return createBody(n, n, pixels, densities, drags, icebergBlock, icebergBlock, icebergRighting);
	}

	// interpolation bilinéaire d'un champ de la grille, (dx, dy) = position de l'échantillon dans la cellule

	function sampleGrid(f, field, x, y, dx, dy)
	{
		var n = f.fNumY;
		var h = f.h;
		var h1 = f.fInvSpacing;

		x = clamp(x, h + dx, (f.fNumX - 1) * h);
		y = clamp(y, h + dy, (f.fNumY - 1) * h);

		var x0 = Math.min(Math.floor((x - dx) * h1), f.fNumX - 2);
		var tx = ((x - dx) - x0 * h) * h1;
		var x1 = Math.min(x0 + 1, f.fNumX - 2);

		var y0 = Math.min(Math.floor((y - dy) * h1), f.fNumY - 2);
		var ty = ((y - dy) - y0 * h) * h1;
		var y1 = Math.min(y0 + 1, f.fNumY - 2);

		var sx = 1.0 - tx;
		var sy = 1.0 - ty;

		return sx * sy * field[x0 * n + y0] + tx * sy * field[x1 * n + y0] +
			tx * ty * field[x1 * n + y1] + sx * ty * field[x0 * n + y1];
	}

	// un sous-pas pour un corps : il subit l'eau (poussée d'Archimède, entraînement par le courant) mais n'agit pas sur elle

	function stepBody(b, f, sdt, gravityX, gravityY, dragRate, rollRate, airFactor)
	{
		var d0 = f.particleRestDensity;
		var h2 = 0.5 * f.h;

		var c = Math.cos(b.angle);
		var s = Math.sin(b.angle);

		var fx = b.mass * gravityX;
		var fy = b.mass * gravityY;
		var torque = 0.0;
		var subArea = 0.0;

		for (var i = 0; i < b.numPoints; i++) {
			var rx = c * b.pointX[i] - s * b.pointY[i];
			var ry = s * b.pointX[i] + c * b.pointY[i];
			var x = b.x + rx;
			var y = b.y + ry;

			// part immergée du point, d'après la densité de particules : entière dès la moitié de la densité au repos,
			// pour qu'un corps à peine plus léger que l'eau (l'iceberg) ne coule pas sur une simple irrégularité
			var sub = clamp((sampleGrid(f, water.density, x, y, h2, h2) / d0 - bodySubMin) / (bodySubFull - bodySubMin), 0.0, 1.0);
			if (sub == 0.0)
				continue;

			var a = b.pointArea[i] * sub;
			var d = b.pointDrag[i] * sub * dragRate;
			subArea += a;
			var vx = b.vx - b.omega * ry;
			var vy = b.vy + b.omega * rx;

			// poussée d'Archimède (opposée à la gravité) et entraînement par l'eau
			var pfx = -a * gravityX + d * (sampleGrid(f, water.u, x, y, 0.0, h2) - vx);
			var pfy = -a * gravityY + d * (sampleGrid(f, water.v, x, y, h2, 0.0) - vy);

			fx += pfx;
			fy += pfy;
			torque += rx * pfy - ry * pfx;
		}

		// lest virtuel : dans l'eau, un couple ramène le haut du corps vers le haut (à l'opposé de la gravité).
		// sans lui une coque large resterait stable à l'envers
		var wet = Math.min(subArea / b.mass, 1.0);
		torque += b.righting / cScale * b.mass * wet * (gravityX * c + gravityY * s);

		b.vx = (b.vx + sdt * fx / b.mass) * airFactor;
		b.vy = (b.vy + sdt * fy / b.mass) * airFactor;
		b.omega = (b.omega + sdt * torque / b.inertia) * airFactor;
		b.omega *= Math.exp(-rollRate * wet * sdt);

		b.x += sdt * b.vx;
		b.y += sdt * b.vy;
		b.angle += sdt * b.omega;

		// parois : pour chacune, le point de contour le plus enfoncé repousse le corps et le fait rebondir

		var minX = f.h, maxX = (f.fNumX - 1) * f.h;
		var minY = f.h, maxY = (f.fNumY - 1) * f.h;

		c = Math.cos(b.angle);
		s = Math.sin(b.angle);

		for (var wall = 0; wall < 4; wall++) {
			var nx = wall == 0 ? 1.0 : wall == 1 ? -1.0 : 0.0;
			var ny = wall == 2 ? 1.0 : wall == 3 ? -1.0 : 0.0;
			var limit = wall == 0 ? minX - b.x : wall == 1 ? b.x - maxX : wall == 2 ? minY - b.y : b.y - maxY;
			if (limit + b.radius <= 0.0)
				continue;

			var maxDepth = 0.0, crx = 0.0, cry = 0.0;
			for (var i = 0; i < b.numContour; i++) {
				var rx = c * b.contourX[i] - s * b.contourY[i];
				var ry = s * b.contourX[i] + c * b.contourY[i];
				var depth = limit - (nx * rx + ny * ry);
				if (depth > maxDepth) {
					maxDepth = depth; crx = rx; cry = ry;
				}
			}
			if (maxDepth == 0.0)
				continue;

			b.x += nx * maxDepth;
			b.y += ny * maxDepth;

			var vn = (b.vx - b.omega * cry) * nx + (b.vy + b.omega * crx) * ny;
			if (vn < 0.0) {
				var rn = crx * ny - cry * nx;
				var j = -(1.0 + bodyRestitution) * vn / (1.0 / b.mass + rn * rn / b.inertia);
				b.vx += j * nx / b.mass;
				b.vy += j * ny / b.mass;
				b.omega += j * rn / b.inertia;
			}
		}
	}

	// collision entre deux corps : chacun teste ses points de contour dans la forme de l'autre

	var contact = { depth : 0.0, x : 0.0, y : 0.0, nx : 0.0, ny : 0.0 };

	// cherche le point de contour de a le plus enfoncé dans b ; sign oriente la normale de b vers a
	function findContact(a, b, sign)
	{
		var ca = Math.cos(a.angle), sa = Math.sin(a.angle);
		var cb = Math.cos(b.angle), sb = Math.sin(b.angle);
		var w = b.width, h = b.height;

		for (var i = 0; i < a.numContour; i++) {
			var x = a.x + ca * a.contourX[i] - sa * a.contourY[i];
			var y = a.y + sa * a.contourX[i] + ca * a.contourY[i];

			// position dans l'image de b
			var dx = x - b.x;
			var dy = y - b.y;
			var lx = cb * dx + sb * dy;
			var ly = -sb * dx + cb * dy;
			var col = Math.floor((lx - b.centerX) * cScale + 0.5 * w);
			var row = Math.floor(0.5 * h - (ly - b.centerY) * cScale);
			if (col < 0 || col >= w || row < 0 || row >= h)
				continue;

			var d = b.depth[row * w + col];
			if (d <= contact.depth)
				continue;

			// la normale sort de b : elle descend la pente de la profondeur
			var gx = (col + 1 < w ? b.depth[row * w + col + 1] : 0.0) - (col > 0 ? b.depth[row * w + col - 1] : 0.0);
			var gy = (row + 1 < h ? b.depth[(row + 1) * w + col] : 0.0) - (row > 0 ? b.depth[(row - 1) * w + col] : 0.0);
			var nlx = -gx;
			var nly = gy;
			var len = Math.sqrt(nlx * nlx + nly * nly);
			if (len == 0.0) {
				nlx = lx; nly = ly;
				len = Math.sqrt(nlx * nlx + nly * nly);
				if (len == 0.0)
					continue;
			}
			contact.depth = d;
			contact.x = x;
			contact.y = y;
			contact.nx = sign * (cb * nlx - sb * nly) / len;
			contact.ny = sign * (sb * nlx + cb * nly) / len;
		}
	}

	function collideBodies(a, b)
	{
		var dx = a.x - b.x;
		var dy = a.y - b.y;
		var reach = a.radius + b.radius;
		if (dx * dx + dy * dy > reach * reach)
			return;

		contact.depth = 0.0;
		findContact(a, b, 1.0);
		findContact(b, a, -1.0);
		if (contact.depth == 0.0)
			return;

		// séparation, répartie selon les masses : le plus léger recule le plus
		var nx = contact.nx;
		var ny = contact.ny;
		var wa = 1.0 / a.mass;
		var wb = 1.0 / b.mass;
		var depth = contact.depth / cScale;
		a.x += nx * depth * wa / (wa + wb);
		a.y += ny * depth * wa / (wa + wb);
		b.x -= nx * depth * wb / (wa + wb);
		b.y -= ny * depth * wb / (wa + wb);

		// rebond au point de contact
		var rax = contact.x - a.x, ray = contact.y - a.y;
		var rbx = contact.x - b.x, rby = contact.y - b.y;
		var vn = ((a.vx - a.omega * ray) - (b.vx - b.omega * rby)) * nx + ((a.vy + a.omega * rax) - (b.vy + b.omega * rbx)) * ny;
		if (vn >= 0.0)
			return;

		var ran = rax * ny - ray * nx;
		var rbn = rbx * ny - rby * nx;
		var j = -(1.0 + bodyRestitution) * vn / (wa + wb + ran * ran / a.inertia + rbn * rbn / b.inertia);
		a.vx += j * nx * wa;
		a.vy += j * ny * wa;
		a.omega += j * ran / a.inertia;
		b.vx -= j * nx * wb;
		b.vy -= j * ny * wb;
		b.omega -= j * rbn / b.inertia;
	}

	function simulateBodies(dt, gravityX, gravityY)
	{
		var f = scene.fluid;
		if (f.particleRestDensity <= 0.0)
			return;

		var timeScale = Math.sqrt(scene.accScale);

		// la grille est bruitée d'une image à l'autre : les corps en voient une version lissée dans le temps
		if (water.fluid != f) {
			water.fluid = f;
			water.density = new Float32Array(f.particleDensity);
			water.u = new Float32Array(f.u);
			water.v = new Float32Array(f.v);
		}
		else {
			var blend = 1.0 - Math.exp(-dt * timeScale / bodySmoothing);
			for (var i = 0; i < f.fNumCells; i++) {
				water.density[i] += blend * (f.particleDensity[i] - water.density[i]);
				water.u[i] += blend * (f.u[i] - water.u[i]);
				water.v[i] += blend * (f.v[i] - water.v[i]);
			}
		}

		// l'eau entraîne les corps d'autant plus vite que la taille simulée est petite
		var dragRate = bodyDrag * timeScale;
		var rollRate = bodyRollDamping * timeScale;

		// sous-pas : assez pour suivre l'oscillation de flottaison, l'entraînement et le redressement de chaque corps
		var g = Math.sqrt(gravityX * gravityX + gravityY * gravityY);
		var rate = 0.0;
		var active = [];
		for (var i = 0; i < bodies.length; i++) {
			var b = bodies[i];
			if (!b.visible)
				continue;
			active.push(b);
			rate = Math.max(rate, Math.sqrt(g * b.width * cScale / b.mass), dragRate * b.drag / b.mass, rollRate,
				Math.sqrt(b.righting / cScale * b.mass * g / b.inertia));
		}
		if (active.length == 0)
			return;

		var numSteps = clamp(Math.ceil(dt * rate / 0.4), 1, 40);
		var sdt = dt / numSteps;
		var airFactor = Math.exp(-bodyAirDamping * timeScale * sdt);

		for (var step = 0; step < numSteps; step++) {
			for (var i = 0; i < active.length; i++)
				stepBody(active[i], f, sdt, gravityX, gravityY, dragRate, rollRate, airFactor);
			for (var i = 0; i < active.length; i++) {
				for (var j = i + 1; j < active.length; j++)
					collideBodies(active[i], active[j]);
			}
		}

		for (var i = 0; i < active.length; i++)
			active[i].angle = Math.atan2(Math.sin(active[i].angle), Math.cos(active[i].angle));
	}

	// affiche ou masque un corps ; masqué, il n'est plus simulé et ne gêne plus l'autre

	function setBodyVisible(b, visible)
	{
		b.visible = visible;
		b.vx = 0.0; b.vy = 0.0; b.omega = 0.0;
	}

	// draw -------------------------------------------------------

	const pointVertexShader = `
		attribute vec2 attrPosition;
		attribute vec3 attrColor;
		uniform vec2 domainSize;
		uniform float pointSize;

		varying vec3 fragColor;

		void main() {
		vec4 screenTransform = 
			vec4(2.0 / domainSize.x, 2.0 / domainSize.y, -1.0, -1.0);
		gl_Position =
			vec4(attrPosition * screenTransform.xy + screenTransform.zw, 0.0, 1.0);

		gl_PointSize = pointSize;
		fragColor = attrColor;
		}
	`;

	const pointFragmentShader = `
		precision mediump float;
		varying vec3 fragColor;

		void main() {
			float rx = 0.5 - gl_PointCoord.x;
			float ry = 0.5 - gl_PointCoord.y;
			float r2 = rx * rx + ry * ry;
			if (r2 > 0.25)
				discard;
			gl_FragColor = vec4(fragColor, 1.0);
		}
	`;

	const meshVertexShader = `
		attribute vec2 attrPosition;
		uniform vec2 domainSize;
		uniform vec3 color;
		uniform vec2 translation;
		uniform float scale;

		varying vec3 fragColor;

		void main() {
			vec2 v = translation + attrPosition * scale;
		vec4 screenTransform = 
			vec4(2.0 / domainSize.x, 2.0 / domainSize.y, -1.0, -1.0);
		gl_Position =
			vec4(v * screenTransform.xy + screenTransform.zw, 0.0, 1.0);

		fragColor = color;
		}
	`;

	const meshFragmentShader = `
		precision mediump float;
		varying vec3 fragColor;

		void main() {
			gl_FragColor = vec4(fragColor, 1.0);
		}
	`;

	const spriteVertexShader = `
		attribute vec2 attrPosition;
		uniform vec2 domainSize;
		uniform vec2 translation;
		uniform vec2 rotation;
		uniform vec2 scale;

		varying vec2 fragCoord;

		void main() {
			vec2 p = attrPosition * scale;
			vec2 v = translation + vec2(rotation.x * p.x - rotation.y * p.y, rotation.y * p.x + rotation.x * p.y);
		vec4 screenTransform = 
			vec4(2.0 / domainSize.x, 2.0 / domainSize.y, -1.0, -1.0);
		gl_Position =
			vec4(v * screenTransform.xy + screenTransform.zw, 0.0, 1.0);

		fragCoord = attrPosition + 0.5;
		}
	`;

	const spriteFragmentShader = `
		precision mediump float;
		uniform sampler2D sprite;
		uniform float alpha;
		varying vec2 fragCoord;

		void main() {
			vec4 color = texture2D(sprite, fragCoord);
			if (color.a < 0.5)
				discard;
			gl_FragColor = vec4(color.rgb, alpha);
		}
	`;

	function createShader(gl, vsSource, fsSource) 
	{
		const vsShader = gl.createShader(gl.VERTEX_SHADER);
		gl.shaderSource(vsShader, vsSource);
		gl.compileShader(vsShader);
		if (!gl.getShaderParameter(vsShader, gl.COMPILE_STATUS))
			console.log("vertex shader compile error: " + gl.getShaderInfoLog(vsShader));

		const fsShader = gl.createShader(gl.FRAGMENT_SHADER);
		gl.shaderSource(fsShader, fsSource);
		gl.compileShader(fsShader);
		if (!gl.getShaderParameter(fsShader, gl.COMPILE_STATUS))
			console.log("fragment shader compile error: " + gl.getShaderInfoLog(fsShader));

		var shader = gl.createProgram();
		gl.attachShader(shader, vsShader);
		gl.attachShader(shader, fsShader);
		gl.linkProgram(shader);

		return shader;
	}

	var pointShader = null;
	var meshShader = null;
	var spriteShader = null;

	var spriteVertBuffer = null;

	// dessine l'image d'un corps, tournée et placée ; alpha < 1 la mélange à ce qui est déjà dessiné

	function drawBody(b, alpha)
	{
		if (spriteShader == null)
			spriteShader = createShader(gl, spriteVertexShader, spriteFragmentShader);

		if (spriteVertBuffer == null) {
			spriteVertBuffer = gl.createBuffer();
			gl.bindBuffer(gl.ARRAY_BUFFER, spriteVertBuffer);
			gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.5, -0.5, 0.5, -0.5, -0.5, 0.5, 0.5, 0.5]), gl.STATIC_DRAW);
			gl.bindBuffer(gl.ARRAY_BUFFER, null);
		}

		if (b.texture == null) {
			// texture : première ligne en bas
			var flipped = new Uint8Array(4 * b.width * b.height);
			for (var r = 0; r < b.height; r++)
				flipped.set(b.pixels.subarray(4 * b.width * (b.height - 1 - r), 4 * b.width * (b.height - r)), 4 * b.width * r);
			b.texture = gl.createTexture();
			gl.bindTexture(gl.TEXTURE_2D, b.texture);
			gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, b.width, b.height, 0, gl.RGBA, gl.UNSIGNED_BYTE, flipped);
			gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
			gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
			gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
			gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
		}

		var c = Math.cos(b.angle);
		var s = Math.sin(b.angle);

		if (alpha < 1.0) {
			gl.enable(gl.BLEND);
			gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ZERO, gl.ONE);
		}

		gl.useProgram(spriteShader);
		gl.uniform2f(gl.getUniformLocation(spriteShader, 'domainSize'), simWidth, simHeight);
		gl.uniform2f(gl.getUniformLocation(spriteShader, 'translation'), 
			b.x + c * b.centerX - s * b.centerY, b.y + s * b.centerX + c * b.centerY);
		gl.uniform2f(gl.getUniformLocation(spriteShader, 'rotation'), c, s);
		gl.uniform2f(gl.getUniformLocation(spriteShader, 'scale'), b.width / cScale, b.height / cScale);
		gl.uniform1f(gl.getUniformLocation(spriteShader, 'alpha'), alpha);

		gl.activeTexture(gl.TEXTURE0);
		gl.bindTexture(gl.TEXTURE_2D, b.texture);
		gl.uniform1i(gl.getUniformLocation(spriteShader, 'sprite'), 0);

		var posLoc = gl.getAttribLocation(spriteShader, 'attrPosition');
		gl.enableVertexAttribArray(posLoc);
		gl.bindBuffer(gl.ARRAY_BUFFER, spriteVertBuffer);
		gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

		gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

		gl.disableVertexAttribArray(posLoc);
		gl.bindBuffer(gl.ARRAY_BUFFER, null);
		gl.disable(gl.BLEND);
	}

	var pointVertexBuffer = null;
	var pointColorBuffer = null;

	var diskVertBuffer = null;
	var diskIdBuffer = null;

	function draw() 
	{
		gl.clearColor(0.0, 0.0, 0.0, 0.0);		// transparent : le dégradé du canvas sert de fond
		gl.clear(gl.COLOR_BUFFER_BIT);

		gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);

		// prepare shaders

		if (pointShader == null)
			pointShader = createShader(gl, pointVertexShader, pointFragmentShader);
		if (meshShader == null)
			meshShader = createShader(gl, meshVertexShader, meshFragmentShader);

		// corps flottants : dessinés avant l'eau, les particules masquent leur partie immergée

		if (iceberg.visible)
			drawBody(iceberg, 1.0);
		if (boat.visible)
			drawBody(boat, 1.0);

		// water

		gl.clear(gl.DEPTH_BUFFER_BIT);

		var pointSize = 2.0 * scene.fluid.particleRadius / simWidth * canvas.width;

		gl.useProgram(pointShader);
		gl.uniform2f(gl.getUniformLocation(pointShader, 'domainSize'), simWidth, simHeight);
		gl.uniform1f(gl.getUniformLocation(pointShader, 'pointSize'), pointSize);

		if (pointVertexBuffer == null)
			pointVertexBuffer = gl.createBuffer();
		if (pointColorBuffer == null)
			pointColorBuffer = gl.createBuffer();

		gl.bindBuffer(gl.ARRAY_BUFFER, pointVertexBuffer);
		gl.bufferData(gl.ARRAY_BUFFER, scene.fluid.particlePos, gl.DYNAMIC_DRAW);

		var posLoc = gl.getAttribLocation(pointShader, 'attrPosition');
		gl.enableVertexAttribArray(posLoc);
		gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

		gl.bindBuffer(gl.ARRAY_BUFFER, pointColorBuffer);
		gl.bufferData(gl.ARRAY_BUFFER, scene.fluid.particleColor, gl.DYNAMIC_DRAW);

		var colorLoc = gl.getAttribLocation(pointShader, 'attrColor');
		gl.enableVertexAttribArray(colorLoc);
		gl.vertexAttribPointer(colorLoc, 3, gl.FLOAT, false, 0, 0);

		gl.drawArrays(gl.POINTS, 0, scene.fluid.numParticles); 

		gl.disableVertexAttribArray(posLoc);
		gl.disableVertexAttribArray(colorLoc);

		gl.bindBuffer(gl.ARRAY_BUFFER, null);

		// l'iceberg se devine à travers l'eau

		if (iceberg.visible && icebergGhost > 0.0)
			drawBody(iceberg, icebergGhost);

		// disk

		// prepare disk mesh

		var numSegs = 50;

		if (diskVertBuffer == null) {

			diskVertBuffer = gl.createBuffer();
			var dphi = 2.0 * Math.PI / numSegs;
			var diskVerts = new Float32Array(2 * numSegs + 2);
			var p = 0;
			diskVerts[p++] = 0.0;
			diskVerts[p++] = 0.0;
			for (var i = 0; i < numSegs; i++) {
				diskVerts[p++] = Math.cos(i * dphi);
				diskVerts[p++] = Math.sin(i * dphi);
			}
			gl.bindBuffer(gl.ARRAY_BUFFER, diskVertBuffer);
			gl.bufferData(gl.ARRAY_BUFFER, diskVerts, gl.DYNAMIC_DRAW);
			gl.bindBuffer(gl.ARRAY_BUFFER, null);

			diskIdBuffer = gl.createBuffer();
			var diskIds = new Uint16Array(3 * numSegs);
			p = 0;
			for (var i = 0; i < numSegs; i++) {
				diskIds[p++] = 0;
				diskIds[p++] = 1 + i;
				diskIds[p++] = 1 + (i + 1) % numSegs;
			}

			gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, diskIdBuffer);
			gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, diskIds, gl.DYNAMIC_DRAW);
			gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, null);
		}

		gl.clear(gl.DEPTH_BUFFER_BIT);

		if (!scene.showObstacle)
			return;

		var diskColor = [0.0, 0.0, 0.0];

		gl.useProgram(meshShader);
		gl.uniform2f(gl.getUniformLocation(meshShader, 'domainSize'), simWidth, simHeight);
		gl.uniform3f(gl.getUniformLocation(meshShader, 'color'), diskColor[0], diskColor[1], diskColor[2]);
		gl.uniform2f(gl.getUniformLocation(meshShader, 'translation'), scene.obstacleX, scene.obstacleY);
		gl.uniform1f(gl.getUniformLocation(meshShader, 'scale'), scene.obstacleRadius + scene.fluid.particleRadius);

		posLoc = gl.getAttribLocation(meshShader, 'attrPosition');
		gl.enableVertexAttribArray(posLoc);
		gl.bindBuffer(gl.ARRAY_BUFFER, diskVertBuffer);
		gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

		gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, diskIdBuffer);
		gl.drawElements(gl.TRIANGLES, 3 * numSegs, gl.UNSIGNED_SHORT, 0);

		gl.disableVertexAttribArray(posLoc);		
		
	}

	function setObstacle(x, y, reset) {

		var vx = 0.0;
		var vy = 0.0;

		if (!reset) {
			vx = (x - scene.obstacleX) / scene.dt;
			vy = (y - scene.obstacleY) / scene.dt;
		}

		scene.obstacleX = x;
		scene.obstacleY = y;
		var r = scene.obstacleRadius;
		var f = scene.fluid;
		var n = f.numY;
		var cd = Math.sqrt(2) * f.h;

		for (var i = 1; i < f.numX-2; i++) {
			for (var j = 1; j < f.numY-2; j++) {

				f.s[i*n + j] = 1.0;

				dx = (i + 0.5) * f.h - x;
				dy = (j + 0.5) * f.h - y;

				if (dx * dx + dy * dy < r * r) {
					f.s[i*n + j] = 0.0;
					f.u[i*n + j] = vx;
					f.u[(i+1)*n + j] = vx;
					f.v[i*n + j] = vy;
					f.v[i*n + j+1] = vy;
				}
			}
		}
		
		scene.showObstacle = true;
		scene.obstacleVelX = vx;
		scene.obstacleVelY = vy;
	}

	// interaction -------------------------------------------------------

	var mouseDown = false;

	function startDrag(x, y) {
		let bounds = canvas.getBoundingClientRect();

		let mx = (x - bounds.left - canvas.clientLeft) * canvas.width / bounds.width;
		let my = (y - bounds.top - canvas.clientTop) * canvas.height / bounds.height;
		mouseDown = true;

		x = mx / cScale;
		y = (canvas.height - my) / cScale;

		setObstacle(x,y, true);
		scene.paused = false;
	}

	function drag(x, y) {
		if (mouseDown) {
			let bounds = canvas.getBoundingClientRect();
			let mx = (x - bounds.left - canvas.clientLeft) * canvas.width / bounds.width;
			let my = (y - bounds.top - canvas.clientTop) * canvas.height / bounds.height;
			x = mx / cScale;
			y = (canvas.height - my) / cScale;
			setObstacle(x,y, false);
		}
	}

	function endDrag() {
		mouseDown = false;
		scene.showObstacle = false;
		scene.obstacleVelX = 0.0;
		scene.obstacleVelY = 0.0;
	}

	canvas.addEventListener('mousedown', event => {
		startDrag(event.x, event.y);
	});

	window.addEventListener('mouseup', event => {
		endDrag();
	});

	canvas.addEventListener('mousemove', event => {
		drag(event.x, event.y);
	});

	canvas.addEventListener('touchstart', event => {
		startDrag(event.touches[0].clientX, event.touches[0].clientY)
	});

	canvas.addEventListener('touchend', event => {
		endDrag()
	});

	canvas.addEventListener('touchcancel', event => {
		endDrag()
	});

	canvas.addEventListener('touchmove', event => {
		event.preventDefault();
		event.stopImmediatePropagation();
		drag(event.touches[0].clientX, event.touches[0].clientY)
	}, { passive: false});


	document.addEventListener('keydown', event => {
		switch(event.key) {
			case 'p': scene.paused = !scene.paused; break;
			case 'm': scene.paused = false; simulate(); scene.paused = true; break;
		}
	});

	// menu des options -------------------------------------------------------

	var menu = document.getElementById("menu");

	function setMenuOpen(open) {
		menu.classList.toggle("open", open);
		menu.setAttribute("aria-hidden", open ? "false" : "true");
		placeCanvas();
	}

	document.getElementById("menuHandle").addEventListener('click', event => { setMenuOpen(true); });
	document.getElementById("menuClose").addEventListener('click', event => { setMenuOpen(false); });

	// balayage vers le haut hors de la simulation : ouvre le menu ;
	// balayage vers le bas sur le menu (hors curseurs) : le referme ;
	// balayage vers le bas ailleurs, hors de la simulation : recharge la page

	var swipeX = 0.0;
	var swipeY = 0.0;
	var swipeMode = 0;		// 0 : aucun, 1 : hors du menu, 2 : sur le menu

	document.addEventListener('touchstart', event => {
		swipeMode = 0;
		if (event.touches.length != 1 || event.target == canvas)
			return;
		if (menu.contains(event.target)) {
			if (event.target.tagName == "INPUT" || menu.scrollTop > 0)
				return;
			swipeMode = 2;
		}
		else
			swipeMode = 1;
		swipeX = event.touches[0].clientX;
		swipeY = event.touches[0].clientY;
	}, { passive: true });

	document.addEventListener('touchmove', event => {
		if (swipeMode == 0)
			return;
		var dx = event.touches[0].clientX - swipeX;
		var dy = event.touches[0].clientY - swipeY;
		if (Math.abs(dy) < 40.0 || Math.abs(dx) > Math.abs(dy))
			return;
		if (swipeMode == 2) {
			if (dy > 0.0)
				setMenuOpen(false);
		}
		else if (dy < 0.0) {
			if (!menu.classList.contains("open"))
				setMenuOpen(true);
		}
		else {
			// rechargement : geste plus long pour éviter les déclenchements involontaires
			if (dy < 90.0)
				return;
			location.reload();
		}
		swipeMode = 0;
	}, { passive: true });

	function updateSliders() {
		scene.shakeGain = 1.0 * document.getElementById("shakeSlider").value;
		scene.flipRatio = 0.1 * document.getElementById("flipSlider").value;
		document.getElementById("shakeLabel").textContent = "x " + scene.shakeGain.toFixed(0);
		document.getElementById("flipLabel").textContent = (100.0 * scene.flipRatio).toFixed(0) + " % FLIP";
	}

	// accéléromètre : la gravité de la simulation suit l'inclinaison de l'appareil

	var motionStatus = document.getElementById("motionStatus");
	var motionEvents = 0;

	function setMotionStatus(text) {
		motionStatus.textContent = "Accéléromètre : " + text;
	}

	if (typeof DeviceMotionEvent == "undefined")
		setMotionStatus("non pris en charge par ce navigateur");
	else if (!window.isSecureContext)
		setMotionStatus("indisponible, la page doit être ouverte en HTTPS");
	else
		setMotionStatus("en attente de données (aucune reçue)");

	function handleMotion(event) {
		var a = event.accelerationIncludingGravity;
		if (a == null || a.x == null || a.y == null) {
			setMotionStatus("événement reçu sans mesure, pas de capteur accessible");
			return;
		}
		if (motionEvents++ % 10 == 0)
			setMotionStatus("actif, x = " + a.x.toFixed(1) + ", y = " + a.y.toFixed(1));

		// séparation inclinaison (gravité) / secousses (accélération propre de l'appareil)
		var lx, ly;
		var lin = event.acceleration;
		if (lin != null && lin.x != null && lin.y != null) {
			lx = lin.x; ly = lin.y;
		}
		else {
			// pas de mesure séparée : la gravité est estimée par un filtre passe-bas
			if (lowPassX == null) { lowPassX = a.x; lowPassY = a.y; }
			lowPassX += 0.1 * (a.x - lowPassX);
			lowPassY += 0.1 * (a.y - lowPassY);
			lx = a.x - lowPassX; ly = a.y - lowPassY;
		}

		// dans le repère de l'appareil, le fluide subit la gravité moins l'accélération de l'appareil.
		// les secousses sont amplifiées car le réservoir simulé (3 m) est bien plus grand que l'écran
		var fx = -((a.x - lx) + scene.shakeGain * lx);
		var fy = -((a.y - ly) + scene.shakeGain * ly);

		// passage du repère de l'appareil au repère de l'écran selon la rotation de l'affichage
		var angle = (screen.orientation && screen.orientation.angle != null) ? screen.orientation.angle : (window.orientation || 0);
		var sx, sy;
		switch ((angle + 360) % 360) {
			case 90 : sx = -fy; sy = fx; break;
			case 180 : sx = -fx; sy = -fy; break;
			case 270 : sx = fy; sy = -fx; break;
			default : sx = fx; sy = fy; break;
		}

		// cumul des mesures reçues entre deux images, moyenné dans simulate()
		motionSumX += sx;
		motionSumY += sy;
		motionCount++;
	}

	var lowPassX = null;
	var lowPassY = null;
	var motionSumX = 0.0;
	var motionSumY = 0.0;
	var motionCount = 0;

	function applyMotion() {
		if (motionCount == 0)
			return;
		var maxAcc = 150.0;
		scene.gravityX = clamp(motionSumX / motionCount, -maxAcc, maxAcc);
		scene.gravity = clamp(motionSumY / motionCount, -maxAcc, maxAcc);
		motionSumX = 0.0;
		motionSumY = 0.0;
		motionCount = 0;
	}

	// démarrage du capteur dès le lancement.
	// l'écoute est toujours inscrite tout de suite : sur Android les mesures arrivent sans autre formalité.
	// quand le navigateur propose une demande d'autorisation (Safari sur iOS, Chrome depuis la version 151),
	// elle est tentée au lancement, puis à chaque toucher tant qu'elle n'est pas accordée
	// (iOS ne l'accepte qu'à la suite d'un geste de l'utilisateur)

	var motionGranted = false;

	function requestMotion() {
		if (motionGranted || motionEvents > 0)
			return;
		if (typeof DeviceMotionEvent == "undefined" || typeof DeviceMotionEvent.requestPermission != "function")
			return;
		try {
			DeviceMotionEvent.requestPermission().then(state => {
				if (state == "granted")
					motionGranted = true;
				else if (motionEvents == 0)
					setMotionStatus("autorisation refusée par le navigateur");
			}).catch(() => {});
		}
		catch (e) {}
	}

	if (typeof DeviceMotionEvent != "undefined") {
		window.addEventListener('devicemotion', handleMotion);
		requestMotion();
		canvas.addEventListener('touchend', requestMotion);
		canvas.addEventListener('mouseup', requestMotion);
		document.addEventListener('click', requestMotion);
	}

	// taille simulée : le curseur va de la taille réelle de l'affichage (à gauche) à 3 m (à droite).
	// réduire la taille du réservoir d'un facteur k revient à multiplier les accélérations par k
	// dans le réservoir de 3 unités ; les vitesses croissent en racine de k, d'où les sous-pas

	function updateTankSize()
	{
		var t = document.getElementById("sizeSlider").value / 100.0;
		var minSize = Math.min(scene.espMode ? espDisplaySize : displaySize, simHeight);
		scene.tankSize = minSize * Math.pow(simHeight / minSize, t);
		scene.accScale = simHeight / scene.tankSize;
		scene.numSubSteps = clamp(Math.ceil(Math.sqrt(scene.accScale)), 1, 8);

		var cm = scene.tankSize * 100.0;
		document.getElementById("sizeLabel").textContent = 
			(cm >= 10.0 ? cm.toFixed(0) : cm.toFixed(1)) + " cm" + (t == 0.0 ? (scene.espMode ? " (taille réelle de la carte)" : " (taille réelle estimée)") : "");
	}

	// mode ESP-Mosaico : la simulation est reconstruite avec le budget de calcul de la carte cible

	var espRes = 48;
	var espPressureIters = 20;
	var espMinPressureIters = 5;
	var espFps = 30;
	var espDisplaySize = 0.0388;	// écran carré de 2,16 pouces de diagonale, en mètres

	function toggleEspMode()
	{
		scene.espMode = !scene.espMode;
		setupScene();
		scene.showObstacle = false;
		placeCanvas();
	}

	// main -------------------------------------------------------

	function simulate() 
	{
		applyMotion();
		if (!scene.paused) {
			scene.fluid.simulate(
				scene.dt, scene.gravity * scene.accScale, scene.flipRatio, 
				Math.max(scene.minPressureIters, Math.ceil(scene.numPressureIters / scene.numSubSteps)),
				scene.numSubSteps > 1 ? 1 : scene.numParticleIters, 
				scene.overRelaxation, scene.compensateDrift,
				scene.obstacleX, scene.obstacleY, scene.obstacleRadius, scene.colorFieldNr);
			simulateBodies(scene.dt, scene.gravityX * scene.accScale, scene.gravity * scene.accScale);
		}
		scene.frameNr++;
	}

	var lastFrameTime = 0.0;
	var perfTime = 0.0;
	var perfFrames = 0;
	var perfSimMs = 0.0;

	function update() {
		var now = performance.now();

		// cadence limitée en mode ESP-Mosaico : on saute les rafraîchissements en trop
		if (scene.targetFps > 0 && now - lastFrameTime < 1000.0 / scene.targetFps - 4.0) {
			requestAnimationFrame(update);
			return;
		}
		lastFrameTime = now;

		simulate();
		perfSimMs += performance.now() - now;
		perfFrames++;
		draw();

		if (now - perfTime >= 1000.0) {
			document.getElementById("perfStatus").textContent = 
				scene.fluid.numParticles + " particules, grille " + scene.fluid.fNumX + "x" + scene.fluid.fNumY + 
				", " + (perfFrames * 1000.0 / (now - perfTime)).toFixed(0) + " images/s, calcul " + 
				(perfSimMs / perfFrames).toFixed(1) + " ms/image";
			perfTime = now;
			perfFrames = 0;
			perfSimMs = 0.0;
		}
		requestAnimationFrame(update);
	}
	
	setupScene();
	scene.showObstacle = false;
	updateTankSize();
	updateSliders();
	update();
	
</script> 
</body>
</html>
